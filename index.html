<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomorrow Takes Practice — Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="site-shell">

  <!-- ============================================================
       HEADER / NAV — identical markup + classes on every page.
       ============================================================ -->
  <header class="site-header">
    <div class="header-inner">
      <span class="brand-title serif">Tomorrow Takes Practice</span>
      <nav class="tab-nav">
        <a href="index.html" class="tab-link is-current">Home</a>
        <a href="about-book.html" class="tab-link">About the Book</a>
        <a href="author.html" class="tab-link">Author</a>
      </nav>
    </div>
  </header>

  <!-- ============================================================
       HERO — the shared .gradient-band background (also used as the
       shorter title band on About the Book / Author) with the arch
       motifs fading in from either edge, the "Coming Soon" headline,
       book title/subtitle/byline, the Kit subscribe form, the
       Instagram link, and the book cover on the right.
       ============================================================ -->
  <section class="gradient-band">
    <div class="arch-motif-wrap" aria-hidden="true">
      <svg class="arch-motif" viewBox="0 0 460 620">
        <path d="M60 600 L60 250 A170 170 0 0 1 400 250 L400 600" fill="none" stroke="#DCD7C2" stroke-width="20"/>
        <path d="M130 600 L130 268 A100 100 0 0 1 330 268 L330 600" fill="none" stroke="#E2DECB" stroke-width="14"/>
      </svg>
      <svg class="arch-motif-r" viewBox="0 0 460 620">
        <path d="M60 600 L60 250 A170 170 0 0 1 400 250 L400 600" fill="none" stroke="#DCD7C2" stroke-width="20"/>
        <path d="M130 600 L130 268 A100 100 0 0 1 330 268 L330 600" fill="none" stroke="#E2DECB" stroke-width="14"/>
      </svg>
    </div>

    <div class="hero-grid">

      <div class="hero-copy">
        <div class="hero-arch-wrap">
          <div class="hero-arch"><span>عمل</span></div>
          <h1 class="hero-title">Coming Soon</h1>
        </div>

        <div class="hero-meta">
          <div class="hero-book-title serif">Tomorrow Takes Practice</div>
          <div class="hero-book-subtitle serif">12 Islamic Values for Everyday Peace</div>
          <div class="hero-book-byline">by Leena Fawad</div>
        </div>

        <!-- ============================================================
             SUBSCRIBE — same Kit-connected form as every other page
             (ids notifyForm / notifyEmail / notifyButton / notifyMessage,
             wired in assets/js/main.js). Only the layout is different.
             ============================================================ -->
        <form id="notifyForm" class="hero-form" novalidate>
          <label for="notifyEmail" class="hero-notify-label">Subscribe to be the first to know when it's available.</label>
          <input type="email" name="email_address" id="notifyEmail" class="notify-input" placeholder="Your email address" required>
          <button type="submit" id="notifyButton" class="btn-green">Notify Me First</button>
        </form>
        <p id="notifyMessage" class="notify-message" role="status" hidden></p>

        <!-- ============================================================
             INSTAGRAM — same link as every other page. Update here and
             in about-book.html / author.html if the handle ever changes.
             ============================================================ -->
        <a href="https://www.instagram.com/leena.author/" target="_blank" rel="noopener" class="hero-ig-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
          Follow @leena.author for first looks
        </a>
      </div>

      <div class="hero-book-wrap">
        <div class="book-scale">
          <div class="book-scale-shadow"></div>
          <img src="assets/img/book-cover.png" alt="Tomorrow Takes Practice — 12 Islamic Values for Everyday Peace, by Leena Fawad">
        </div>
      </div>

    </div>
  </section>

  <footer class="site-footer">© 2026 · Coming soon</footer>
</div>

<!-- ============================================================
     PDF READER OVERLAY — hidden by default, opened by
     assets/js/main.js when the URL has ?read=filename. Body is split
     into a left sidebar (subscribe + Instagram, always visible) and
     the actual reading area (canvas + prev/next) on the right.
     ============================================================ -->
<div id="pdfReaderOverlay" class="pdf-reader-overlay" hidden>

  <div class="pdf-reader-topbar">
    <span id="pdfReaderTitle" class="pdf-reader-title serif">Tomorrow Takes Practice</span>
    <button type="button" id="pdfReaderClose" class="pdf-reader-close">← Back to the book</button>
  </div>

  <div class="pdf-reader-body">

    <!-- Left sidebar: same plain hero-style subscribe + Instagram as
         every other page, just stacked in a narrower column. -->
    <aside class="reader-sidebar">
      <form id="readerNotifyForm" class="hero-form" novalidate>
        <label for="readerNotifyEmail" class="hero-notify-label">Subscribe to be the first to know when it's available.</label>
        <input type="email" name="email_address" id="readerNotifyEmail" class="notify-input" placeholder="Your email address" required>
        <button type="submit" id="readerNotifyButton" class="btn-green">Notify Me First</button>
      </form>
      <p id="readerNotifyMessage" class="notify-message" role="status" hidden></p>

      <a href="https://www.instagram.com/leena.author/" target="_blank" rel="noopener" class="hero-ig-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
        Follow @leena.author for first looks
      </a>
    </aside>

    <!-- Right side: the actual chapter — status/loading text, the
         rendered page, and prev/next controls. -->
    <div class="pdf-reader-main">
      <div id="pdfReaderStatus" class="pdf-reader-status"></div>

      <div id="pdfReaderViewport" class="pdf-reader-viewport" hidden>
        <div class="pdf-reader-canvas-wrap">
          <canvas id="pdfReaderCanvas"></canvas>
          <div class="pdf-reader-watermark" aria-hidden="true"></div>
        </div>
      </div>

      <div id="pdfReaderControls" class="pdf-reader-controls" hidden>
        <button id="pdfPrevPage" class="pdf-reader-nav-button" type="button">‹ Prev</button>
        <span id="pdfPageIndicator" class="pdf-reader-page-indicator">Page 1 of 1</span>
        <button id="pdfNextPage" class="pdf-reader-nav-button" type="button">Next ›</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
