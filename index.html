<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div style="min-height: 100vh;">
  <nav style="display: flex; align-items: center; justify-content: space-between; padding: 22px 64px; border-bottom: 1px solid rgba(163,121,58,0.4);">
    <div style="display: flex; align-items: baseline; gap: 14px;">
      <span style="color: #a3793a; font-size: 15px;">◆</span>
      <span style="font-size: 24px; font-weight: 600; letter-spacing: 0.5px;">Thank You</span>
    </div>
    <div style="display: flex; align-items: center; gap: 36px; font-size: 18px;">
      <a href="#read" class="nav-link" data-page="read" style="text-decoration: none;">Read</a>
    </div>
  </nav>

  <section id="read" class="page">
    <div style="padding: 90px 64px; text-align: center; max-width: 700px; margin: 0 auto;">
      <div style="color: #7c5a22; font-size: 15px; letter-spacing: 3px; font-weight: 600;">READ ONLINE</div>
      <h2 style="font-size: 42px; font-weight: 500; margin: 20px 0 14px;">Thank you for reading</h2>
      <p style="font-size: 22px; line-height: 1.5; color: #38462f; margin: 0;">If someone sent you a link to a sample chapter or excerpt, open it directly — it'll take you straight into the reader, right here on this page.</p>
    </div>
  </section>
</div>

<div id="pdfReaderOverlay" class="pdf-reader-overlay" hidden>
  <div class="pdf-reader-topbar">
    <span id="pdfReaderTitle" class="pdf-reader-title">Thank You</span>
    <a href="#read" id="pdfReaderClose" class="pdf-reader-close">Close ✕</a>
  </div>

  <div id="pdfReaderStatus" class="pdf-reader-status"></div>

  <div id="pdfReaderViewport" class="pdf-reader-viewport" hidden>
    <div class="pdf-reader-canvas-wrap">
      <canvas id="pdfReaderCanvas"></canvas>
      <div class="pdf-reader-watermark" aria-hidden="true"></div>
    </div>
  </div>

  <div id="pdfReaderControls" class="pdf-reader-controls" hidden>
    <button id="pdfPrevPage" class="pdf-reader-nav-button" type="button">‹ Prev</button>
    <span id="pdfPageIndicator" class="pdf-reader-page-indicator">Page 1 of 1</span>
    <button id="pdfNextPage" class="pdf-reader-nav-button" type="button">Next ›</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
